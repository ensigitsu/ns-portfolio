profile_kicker:
  fr: 01 / PROFIL
  en: 01 / PROFILE
profile_title:
  fr: 'Comprendre les systèmes.

    Construire la suite.'
  en: 'Understand systems.

    Build what comes next.'
profile_text:
  fr:
    Je suis Nathan, étudiant en première année de BTS SIO, option SISR. Je m’intéresse aux infrastructures,
    aux systèmes et aux réseaux qui rendent les services numériques possibles.
  en:
    I’m Nathan, a first-year BTS SIO student specialising in systems and networks. I’m interested in
    the infrastructure that makes digital services possible.
profile_text_2:
  fr:
    'Mon objectif à long terme : évoluer vers l’architecture cloud, avec une attention particulière
    portée à la sécurité. Ce portfolio documente mes réalisations et les compétences que je construis
    pendant ma formation.'
  en:
    My long-term goal is to move towards cloud architecture, with a particular focus on security. This
    portfolio documents my work and the competencies I develop during my studies.
