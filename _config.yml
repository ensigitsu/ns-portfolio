title: Nathan S.
description: Professional portfolio of Nathan S., a BTS SIO systems and networks student.
lang: fr
url: ''
baseurl: /portfolio
email: ''
github_url: ''
linkedin: https://www.linkedin.com/in/nathan-sas
repository_url: ''
avatar:
  enabled: false
  model: /assets/models/avatar.glb
collections:
  projets:
    output: true
    permalink: /projets/:name/
defaults:
  - scope:
      path: ''
      type: projets
    values:
      layout: project
future: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - README.md
  - LICENSE
  - CONTENT-LICENSE.md
  - THIRD-PARTY-NOTICES.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - local-preview
  - docs
  - scripts
  - vendor
  - dist
  - .bundle
  - .gitignore
  - .jekyll-cache
  - _projets/_A-COPIER.md
