title: Nathan S.
description: Professional portfolio of Nathan S., a BTS SIO systems and networks student.
lang: fr
url: https://ensigitsu.github.io
baseurl: /ns-portfolio
email: ''
github_url: https://github.com/ensigitsu
linkedin: https://www.linkedin.com/in/nathan-sas
repository_url: https://github.com/ensigitsu/ns-portfolio
avatar:
  enabled: false
  model: /assets/models/avatar.glb
collections:
  projets:
    output: true
    permalink: /projets/:name/
defaults:
  - scope:
      path: ''
      type: projets
    values:
      layout: project
future: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - mentions-legales.md
  - README.md
  - LICENSE
  - CONTENT-LICENSE.md
  - THIRD-PARTY-NOTICES.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - local-preview
  - docs
  - scripts
  - vendor
  - dist
  - .bundle
  - .gitignore
  - .jekyll-cache
  - _projets/_A-COPIER.md
